<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - e-Barangay Health System</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- BACKGROUND DASHBOARD OVERLAY -->
  <div class="bg-overlay"></div>

  <!-- LOGIN CONTAINER -->
  <div class="login-wrapper">
    <div class="brand-header">
      <div class="system-logo">
        <!-- PNG LOGO REPLACEMENT -->
        <img src="../image/logo.png" alt="e-Barangay Logo" class="brand-png-logo">
      </div>
      <h1>e-BARANGAY <span>HEALTH SYSTEM</span></h1>
      <p class="location-sub">Brgy. New Katipunan, Matanao, Davao Region</p>
    </div>

    <h2 class="form-title">LOG IN</h2>

    <form id="loginForm" class="login-form">
      <div class="input-box">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" placeholder="BHW ID / Username" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-login">
        LOG IN <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div class="login-links">
        <a href="#" class="forgot-link">Forgot Password?</a>
        <button type="button" id="btnOpenRegister" class="register-link">
          Register New BHW Account
        </button>
      </div>
    </form>
  </div>

  <!-- REGISTER NEW BHW ACCOUNT MODAL -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <div class="register-brand">
        <div class="modal-logo">
          <!-- PNG LOGO REPLACEMENT FOR MODAL -->
          <img src="../images/logo.png" alt="e-Barangay Logo" class="modal-png-logo">
        </div>
        <div>
          <h3>e-BARANGAY <span>HEALTH SYSTEM</span></h3>
          <p>Brgy. New Katipunan, Matanao, Davao Region</p>
        </div>
      </div>

      <div class="modal-title-area">
        <h2>CREATE NEW BHW ACCOUNT <span class="sub-tag">(QUICK & EASY REGISTRATION)</span></h2>
      </div>

      <form id="registerForm" class="register-form">
        <div class="register-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="" required>
          </div>

          <div class="form-group">
            <label>Preferred Username (BHW ID)</label>
            <input type="text" placeholder="" required>
          </div>

          <div class="form-group">
            <label>Date of Birth (MM/DD/YYYY)</label>
            <input type="text" placeholder="MM/DD/YYYY" required>
          </div>

          <div class="form-group">
            <label>Secure Password</label>
            <input type="password" placeholder="" required>
          </div>

          <div class="form-group">
            <label>Assigned Purok</label>
            <select required>
              <option value="" disabled selected></option>
              <option value="Calachuchi">Purok Calachuchi</option>
              <option value="Bougainvillea">Purok Bougainvillea</option>
              <option value="Walingwaling">Purok Walingwaling</option>
              <option value="Sampaguita">Purok Sampaguita</option>
              <option value="Santan">Purok Santan</option>
              <option value="Rose">Purok Rose</option>
              <option value="Daisy">Purok Daisy</option>
            </select>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="" required>
          </div>

          <div class="form-group full-width">
            <label>Contact Number (PH)</label>
            <input type="text" placeholder="" required>
          </div>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-create">CREATE ACCOUNT & START WORKING</button>
          <button type="button" id="btnCancelRegister" class="btn-cancel-modal">CANCEL / BACK TO LOGIN</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
