<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - e-Barangay Health System</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- BACKGROUND DASHBOARD OVERLAY -->
  <div class="bg-overlay"></div>

  <!-- LOGIN CONTAINER -->
  <div class="login-wrapper">
    <div class="brand-header">
      <div class="system-logo">
        <!-- PNG LOGO REPLACEMENT -->
        <img src="../assets/logo.png" alt="e-Barangay Logo" class="brand-png-logo">
      </div>
      <h1>E-BARANGAY <span>HEALTH SYSTEM</span></h1>
      <p class="location-sub">Brgy. New Katipunan, Matanao, Davao Region</p>
    </div>

    <h2 class="form-title">LOG IN</h2>

    <form id="loginForm" class="login-form">
      <div class="input-box">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" placeholder="BHW ID / Username" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-login">
        LOG IN <i class="fa-solid fa-arrow-right"></i>
      </button>

      <div class="login-links">
        <button type="button" id="btnOpenAdmin" class="admin-link">
          Admin
        </button>
      </div>
    </form>
  </div>

  <!-- ADMIN LOGIN MODAL -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <div class="register-brand">
        <div class="modal-logo">
          <img src="../assets/logo.png" alt="e-Barangay Logo" class="modal-png-logo">
        </div>
        <div>
          <h3>E-BARANGAY <span>HEALTH SYSTEM</span></h3>
          <p>Brgy. New Katipunan, Matanao, Davao Region</p>
        </div>
      </div>

      <div class="modal-title-area">
        <h2>ADMIN LOGIN <span class="sub-tag">(SYSTEM MANAGEMENT)</span></h2>
      </div>

      <form id="adminLoginForm" class="admin-login-form">
        <div class="form-group">
          <label>Admin Username</label>
          <input type="text" id="adminUsername" placeholder="Enter admin username" required>
        </div>

        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-create">LOGIN TO ADMIN PANEL</button>
          <button type="button" id="btnCancelAdmin" class="btn-cancel-modal">CANCEL / BACK TO LOGIN</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/credentials.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
